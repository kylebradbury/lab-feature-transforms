<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overfitting Lab</title>
  <meta name="description" content="Interactive lab: add noise to clean data, make logistic regression (polynomial degree) or KNN (k) more flexible, and watch training and held-out accuracy pull apart. Reach held-out goals, resample the training set to see bias and variance, and submit a report.">
  <script>
    // Light or dark before first paint: the saved choice (Theme button), else the system setting.
    (function () {
      var mode = null;
      try { mode = JSON.parse(localStorage.getItem('ftlab:theme')); } catch (e) {}
      if (mode !== 'light' && mode !== 'dark') mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = mode;
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/overfit.css">
  <!-- COLOR THEME. Every color (and the class names and point shapes) is set in
       this one file. "brand" = green and dark gray; "classic" = the original
       orange and blue. Change the file name to switch themes, or preview another
       without editing: index.html?theme=brand -->
  <link rel="stylesheet" href="css/themes/classic.css">
  <script>
    // ?theme=<name> loads css/themes/<name>.css on top of the theme above.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t && /^[a-z0-9-]+$/.test(t)) document.write('<link rel="stylesheet" href="css/themes/' + t + '.css">');
    })();
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
</head>
<body class="ofl">
  <div id="app"></div>
  <script>
    // ES modules do not load from file:// — explain how to start a local server.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="banner">This lab must be served over http. In this folder run ' +
        '<code>python3 -m http.server 8000</code> and open <code>http://localhost:8000</code>.</div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
