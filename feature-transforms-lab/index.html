  <script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"

<body>
  <div id="app"></div>
  <script>
    // ES modules do not load from file:// — explain how to start a local server.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="banner">This lab must be served over http. In this folder run ' +
        '<code>python3 -m http.server 8000</code> and open <code>http://localhost:8000</code>.</div>';
